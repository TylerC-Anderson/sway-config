# Auth/keyring/portals
exec --no-startup-id /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec --no-startup-id sh -c ' eval $(gnome-keyring-daemon --login) eval $(gnome-keyring-daemon --start --components=secrets,ssh) export SSH_AUTH_SOCK'
exec systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec nm-applet

# Clipboard persistence
exec wl-paste --type text --watch cliphist store
exec wl-paste --type image --watch cliphist store

# Screenshot annotator over fullscreen games
# A fullscreen window covers every normal toplevel on its output, so the satty
# annotation window opens hidden behind a fullscreen game. Forcing satty
# fullscreen makes it take the top fullscreen slot; the game's own fullscreen is
# restored when satty closes. (slurp's region selector is already above fullscreen
# because it's a layer-shell surface, not a toplevel — satty is the toplevel.)
for_window [app_id="com.gabm.satty"] fullscreen enable
