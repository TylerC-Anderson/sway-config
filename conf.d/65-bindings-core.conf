# Core bindings
bindsym $mod+Return exec $term
# $mod+q is the "later" workspace, so kill moves to $mod+Ctrl+q — Super-prefixed
# combos never reach applications, unlike a bare Ctrl+Shift+q.
bindsym $mod+Ctrl+q kill
bindsym $mod+ctrl+shift+q [workspace=__focused__] kill
bindsym $mod+space exec $menu
floating_modifier $mod normal
bindsym $mod+Shift+ctrl+c reload
bindsym $mod+Shift+e exec $waylogout

# Layout
bindsym $mod+f fullscreen
bindsym $mod+Shift+space floating toggle
bindsym $mod+Ctrl+Shift+h split horizontal
bindsym $mod+Ctrl+Shift+v split vertical

# Selection Movement
bindsym $mod+$left  focus left
bindsym $mod+$down  focus down
bindsym $mod+$up    focus up
bindsym $mod+$right focus right
bindsym $mod+Left   focus left
bindsym $mod+Down   focus down
bindsym $mod+Up     focus up
bindsym $mod+Right  focus right

# Move windows
bindsym $mod+Shift+$left  move left
bindsym $mod+Shift+$down  move down
bindsym $mod+Shift+$up    move up
bindsym $mod+Shift+$right move right
bindsym $mod+Shift+Left   move left
bindsym $mod+Shift+Down   move down
bindsym $mod+Shift+Up     move up
bindsym $mod+Shift+Right  move right
