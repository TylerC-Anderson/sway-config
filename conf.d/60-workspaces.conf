# Named workspaces bound to outputs
#
# Names carried from the AeroSpace setup on the Mac so both machines share one
# mental model, plus `vm` and `game`, which have no Mac counterpart.

# Left monitor (Acer SB220Q)
workspace "auth"      output HDMI-A-2
workspace "reference" output HDMI-A-2
workspace "notes"     output HDMI-A-2
workspace "later"     output HDMI-A-2

# Middle monitor (LG ULTRAGEAR)
workspace "research"  output DP-2
workspace "browse"    output DP-2
workspace "video"     output DP-2
workspace "vm"        output DP-2
workspace "terminal"  output DP-2
workspace "code"      output DP-2
workspace "write"     output DP-2
workspace "game"      output DP-2

# Right monitor (Sceptre F22, rotated)
workspace "music"     output HDMI-A-1
workspace "messages"  output HDMI-A-1

# Numbered catch-alls for temporary/holding use, all on the middle monitor —
# whatever lands here can be moved into a named workspace once it has a purpose.
workspace number 1  output DP-2
workspace number 2  output DP-2
workspace number 3  output DP-2
workspace number 4  output DP-2
workspace number 5  output DP-2
workspace number 6  output DP-2
workspace number 7  output DP-2
workspace number 8  output DP-2
workspace number 9  output DP-2
workspace number 10 output DP-2

# App → Workspace assignments
assign [app_id="obsidian"]   workspace "reference"
assign [app_id="firefox"]    workspace "browse"
assign [app_id="code"]       workspace "code"
assign [app_id="vencord"]    workspace "messages"
assign [app_id="signal"]     workspace "messages"
assign [app_id="vmware"]     workspace "vm"
assign [app_id="tidal-hifi"] workspace "music"
assign [app_id="steam"]      workspace "game"
assign [app_id="gamescope"]  workspace "game"
