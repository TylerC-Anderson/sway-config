# Named workspaces bound to outputs

# Left monitor (Acer)
workspace "left" output HDMI-A-2
workspace "ref"  output HDMI-A-2
workspace "brws" output HDMI-A-2

# Middle monitor (LG)
workspace "midl" output DP-2
workspace "note" output DP-2
workspace "code" output DP-2
workspace "rsrch" output DP-2
workspace "vm"   output DP-2
workspace "wtch" output DP-2

# Right monitor (Sceptre)
workspace "rght" output HDMI-A-1
workspace "chat" output HDMI-A-1
workspace "llm"  output HDMI-A-1

# App → Workspace assignments
assign [app_id="obsidian"] workspace "ref"
assign [app_id="firefox"]  workspace "brws"
assign [app_id="code"]     workspace "code"
assign [app_id="vencord"]  workspace "chat"
assign [app_id="signal"]   workspace "chat"
assign [app_id="vmware"]   workspace "vm"
