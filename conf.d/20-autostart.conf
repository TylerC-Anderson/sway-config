# Apps that should spawn at session start
# Notification daemon first, so it's listening before other apps emit notifications
exec mako
exec obsidian
exec firefox

# EasyEffects headless: keeps the Sonys virtual-surround/EQ voicing chain alive.
# Must run for the audio processing (Music-Detailed preset) to apply. --hide-window
# so it starts in the background without popping the GUI each login.
exec easyeffects --service-mode --hide-window
