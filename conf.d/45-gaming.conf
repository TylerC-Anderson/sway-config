# Gaming window rules
# No Man's Sky (Steam appid 275850). Runs under XWayland via Proton, so it has an
# X11 class, NOT a Wayland app_id. Class confirmed via `swaymsg -t get_tree`
# 2026-09-16: class == instance == "steam_app_275850", app_id null.
# The output identifier matches 40-outputs.conf (make/model/serial), not "DP-2".

# Send NMS to the "game" workspace (pinned to the LG in 60-workspaces.conf) and
# fullscreen it. NOTE: target the WORKSPACE, not the output -- "move to output"
# drops the window on whatever workspace is already active on that monitor, so a
# launch from any LG workspace leaves NMS stuck where it started.
for_window [class="steam_app_275850"] move to workspace "game", fullscreen enable

# Kill SwayFX eye-candy on the game window (blur + rounded corners are enabled
# globally in 50-appearance.conf). Fullscreen hides them anyway; this drops any
# per-frame effect overhead and edge artifacts.
for_window [class="steam_app_275850"] blur disable, shadows disable, corner_radius 0

# Belt-and-suspenders idle inhibit. No-op today (no swayidle/idle daemon
# installed, so nothing blanks on idle) but correct if you add one later.
for_window [class="steam_app_275850"] inhibit_idle fullscreen
