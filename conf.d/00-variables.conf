# Variables & launchers
set $mod Mod4
set $left h
set $down j
set $up k
set $right l
set $term ghostty
set $menu pgrep wofi >/dev/null 2>&1 && killall wofi || wofi --show drun
set $file_explorer nautilus

# Waylogout command with styling
set $waylogout waylogout \
    --hide-cancel \
    --screenshots \
    --effect-blur=7x5 \
    --indicator-thickness=20 \
    --ring-color=888888aa \
    --inside-color=88888866 \
    --text-color=eaeaeaaa \
    --line-color=00000000 \
    --ring-selection-color=33cc33aa \
    --inside-selection-color=33cc3366 \
    --text-selection-color=eaeaeaaa \
    --line-selection-color=00000000 \
    --lock-command="swaylock -f -c /home/tyler/.config/swaylock/config" \
    --logout-command="loginctl terminate-user $USER" \
    --suspend-command="systemctl suspend" \
    --hibernate-command="systemctl hibernate" \
    --poweroff-command="systemctl poweroff" \
    --reboot-command="systemctl reboot" \
    --selection-label
