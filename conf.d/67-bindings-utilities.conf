# App launchers

# File explorer
bindsym $mod+ctrl+f exec $file_explorer
# VS Code → "code"
bindsym Ctrl+$mod+v exec sh -c 'swaymsg workspace "code"; exec code'
# Browser → "brws"
bindsym Ctrl+$mod+b exec sh -c 'swaymsg workspace "brws"; exec firefox'
# Obsidian → "ref"
bindsym Ctrl+$mod+r exec sh -c 'swaymsg workspace "ref"; exec obsidian'
# Notes (terminal + Neovim) → "note"
bindsym Ctrl+$mod+n exec sh -c 'swaymsg workspace "note"; exec $term -e code'
# Research terminal → "rsrch"
bindsym Ctrl+$mod+x exec sh -c 'swaymsg workspace "rsrch"; exec $term'
# VMware → "vm"
bindsym Ctrl+$mod+z exec sh -c 'swaymsg workspace "vm"; exec vmware'
# Watching / streaming → "wtch"
bindsym Ctrl+$mod+w exec sh -c 'swaymsg workspace "wtch"; exec firefox --new-window https://youtube.com'
# Chat apps → "chat"
bindsym Ctrl+$mod+d exec sh -c 'swaymsg workspace "chat"; exec vesktop'
bindsym Ctrl+$mod+s exec sh -c 'swaymsg workspace "chat"; exec signal-desktop'


# Volume (PulseAudio)
bindsym --locked XF86AudioMute        exec pactl set-sink-mute \@DEFAULT_SINK@ toggle
bindsym --locked XF86AudioLowerVolume exec pactl set-sink-volume \@DEFAULT_SINK@ -5%
bindsym --locked XF86AudioRaiseVolume exec pactl set-sink-volume \@DEFAULT_SINK@ +5%
bindsym --locked XF86AudioMicMute     exec pactl set-source-mute \@DEFAULT_SOURCE@ toggle

# Brightness
bindsym --locked XF86MonBrightnessDown exec brightnessctl set 5%-
bindsym --locked XF86MonBrightnessUp   exec brightnessctl set 5%+

# Screenshots
bindsym Print exec grim
bindsym $mod+Shift+ctrl+s exec "QT_QPA_PLATFORM=xcb flameshot gui"
# bindsym $mod+Shift+s exec grim -c -g "$(slurp)" - | swappy -f -

# Clipboard history
bindsym $mod+alt+v exec cliphist list | wofi --show dmenu | cliphist decode | wl-copy && sleep 0.1 && wtype -M ctrl v -m ctrl
