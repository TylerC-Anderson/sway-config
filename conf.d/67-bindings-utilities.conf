# App launchers
# Ctrl+$mod+<letter> launches an app onto the workspace $mod+<letter> switches
# to, so the launcher letter and the workspace letter match. Signal is the one
# exception: it shares "messages" with vesktop, so it keeps its own letter.

# File explorer
bindsym $mod+ctrl+f exec $file_explorer
# VS Code → "code"
bindsym Ctrl+$mod+c exec sh -c 'swaymsg workspace "code"; exec code'
# Browser → "browse"
bindsym Ctrl+$mod+b exec sh -c 'swaymsg workspace "browse"; exec firefox'
# Obsidian → "reference"
bindsym Ctrl+$mod+r exec sh -c 'swaymsg workspace "reference"; exec obsidian'
# Notes (terminal + Neovim) → "notes"
bindsym Ctrl+$mod+n exec sh -c 'swaymsg workspace "notes"; exec $term -e nvim'
# Research terminal → "research"
bindsym Ctrl+$mod+x exec sh -c 'swaymsg workspace "research"; exec $term'
# Terminal → "terminal"
bindsym Ctrl+$mod+t exec sh -c 'swaymsg workspace "terminal"; exec $term'
# VMware → "vm"
bindsym Ctrl+$mod+z exec sh -c 'swaymsg workspace "vm"; exec vmware'
# Watching / streaming → "video"
bindsym Ctrl+$mod+v exec sh -c 'swaymsg workspace "video"; exec firefox --new-window https://youtube.com'
# Chat apps → "messages"
bindsym Ctrl+$mod+m exec sh -c 'swaymsg workspace "messages"; exec vesktop'
bindsym Ctrl+$mod+s exec sh -c 'swaymsg workspace "messages"; exec signal-desktop'
# Steam → "game"
bindsym Ctrl+$mod+g exec sh -c 'swaymsg workspace "game"; exec steam'


# Volume (PulseAudio)
bindsym --locked XF86AudioMute        exec pactl set-sink-mute \@DEFAULT_SINK@ toggle
bindsym --locked XF86AudioLowerVolume exec pactl set-sink-volume \@DEFAULT_SINK@ -5%
bindsym --locked XF86AudioRaiseVolume exec pactl set-sink-volume \@DEFAULT_SINK@ +5%
bindsym --locked XF86AudioMicMute     exec pactl set-source-mute \@DEFAULT_SOURCE@ toggle

# Brightness
bindsym --locked XF86MonBrightnessDown exec brightnessctl set 5%-
bindsym --locked XF86MonBrightnessUp   exec brightnessctl set 5%+

# Screenshots
# Print → quick full-screen grab of the focused output, straight to ~/Pictures via grim.
bindsym Print exec grim
# Snapshot/redact → slurp region select, annotate/redact in satty.
# grim captures via wlr-screencopy (works over fullscreen games and the rotated
# HDMI-A-1); satty gives arrows/markers/shapes/blur/text, copies to clipboard, saves
# to ~/Pictures. The script also restores any game whose fullscreen satty displaced
# (see the satty for_window rule in 10-env-and-agents.conf for why it's needed).
bindsym $mod+Shift+ctrl+s exec ~/.config/sway/scripts/sway-screenshot-annotate.sh

# Clipboard history
bindsym $mod+alt+v exec cliphist list | wofi --show dmenu | cliphist decode | wl-copy && sleep 0.1 && wtype -M ctrl v -m ctrl
# Clipboard wipe — Shift is the destructive variant of the history gesture.
# Clears cliphist's stored history and the live wl-clipboard selection.
bindsym $mod+alt+Shift+v exec cliphist wipe && wl-copy --clear && notify-send "Clipboard" "History wiped"
